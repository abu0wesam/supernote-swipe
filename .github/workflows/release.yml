name: Release

# Manual only: pushing source changes or tags never starts a build.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare checked PDF Tool patch and icon
        run: python3 tools/prepare_pdf_tool.py
      - name: Prepare exact preview and bold icon 6
        run: python3 tools/prepare_exact_preview.py
      - name: Prepare frame-aware text block
        run: python3 tools/prepare_frame_fix.py
      - name: Prepare Text toolbar icon
        run: python3 tools/prepare_text_assets.py
      - name: Test conversion sleep guard
        run: node tools/test_pdf_apply_guard.mjs
      - name: Test Text formatting rules
        run: node tools/test_text_css.mjs
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - name: Android SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Release tag (the pushed tag must match PluginConfig.json)
        id: tag
        run: |
          version=$(node -p "require('./PluginConfig.json').versionName")
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != v$version"; exit 1; }
          fi
          echo "name=v$version" >> "$GITHUB_OUTPUT"
      - run: bash ./buildPlugin.sh
      - run: |
          ls -la build/outputs
          test -n "$(ls build/outputs/*.snplg)"
      - run: cp "$(ls build/outputs/*.snplg | head -n1)" build/outputs/PDFTool.snplg
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: build/outputs/PDFTool.snplg
          generate_release_notes: true
